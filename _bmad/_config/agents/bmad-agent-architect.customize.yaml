memories:
  - 'Tech stack LOCKED: Supabase (Postgres + pgvector + Auth + RLS + pg_cron), Edge Functions (Deno/TS), Next.js 14+ App Router, Tailwind + Framer Motion'
  - 'LLM architecture: Dual-LLM — Claude 3.5 Sonnet (coaching responses, sync) + GPT-4o-mini (analysis pipeline, async)'
  - 'Embeddings: OpenAI text-embedding-3-small via pgvector for semantic memory'
  - 'Proactive scheduling: Queue-based worker pattern (one pg_cron job → batch Edge Function → 50 msgs/cycle)'
  - 'NO heavy agent frameworks (LangChain, LlamaIndex). Direct API calls only.'
  - 'Telegram Bot API for messaging channel. Webhook-based, not polling.'
  - 'Hosting: Vercel (Next.js dashboard) + Supabase (everything else)'
  - 'Payments: Stripe'
  - 'Scraping: Jina AI (websites) + user paste (LinkedIn) + Gemini 2.0 grounding (news)'
  - 'Coach App lives at MasteryTV.com/CoachApp — route group (coach) in existing Next.js project'
  - 'RLS policies REQUIRED on every table — no exceptions'
  - 'Database: users, messages, coach_profiles (10+ personality dimensions), memory_facts, scheduled_messages, analysis_queue, daily_usage'
  - 'Edge Function 150s timeout constraint — long analysis must be queued and batched'
